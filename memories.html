<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memories</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css
"
    />
  </head>
  <body>
    <header class="header">
      <div class="navbar">
        <h2 class="navbar-logo fade-down">ariannegem</h2>
        <ul class="navbar-menu fade-down">
          <button id="menu-close-button" class="fas fa-times"></button>
          <li class="navbar-links">
            <a href="index.html" class="link">HappyBirthday</a>
          </li>
          <li class="navbar-links">
            <a href="menu.html" class="link">Collection</a>
          </li>
          <li class="navbar-links">
            <a href="memories.html" class="link">Memories</a>
          </li>
          <li class="navbar-links">
            <a href="letter.html" class="link">Letter</a>
          </li>

          <li class="navbar-links">
            <a href="wish.html" class="link">Wishes</a>
          </li>
        </ul>
        <button id="menu-open-button" class="fas fa-bars"></button>
      </div>
    </header>

    <section class="memories">
      <div class="memories-content">
        <div class="section-header">
          <h2 class="collection-section-title">Memories</h2>
          <p class="collection-section-subtitle">
            Every chapter of our story is my favorite.
          </p>
        </div>

        <div class="memory-card">
          <h2 class="collection-image-title">Gem</h2>
          <img src="images/gemcolage.png" class="memory-image" />
        </div>

        <div class="memory-card">
          <h2 class="collection-image-title">❤️ Best Friends</h2>
          <img src="images/besfriendcollage.png" class="memory-image" />
        </div>

        <div class="memory-card">
          <h2 class="collection-image-title">✈️ Travel Buddies</h2>
          <img src="images/travelcollage.png" class="memory-image" />
        </div>

        <div class="memory-card video-card">
          <h2 class="collection-image-title">Our Greatest Journey ❤️</h2>

          <iframe
            class="memory-video"
            width="100%"
            height="480"
            src="https://www.youtube.com/embed/w7BjyzZOFK4"
            title="Wedding SDE"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="exit-container">
          <a href="menu.html" class="exit-btn">← Make new Memories</a>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
